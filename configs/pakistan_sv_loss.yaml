seed: 42

data:
  root: data/pakistan
  cache_dir: data/pakistan/cache
  label_dir: flood_maps
  target_shape: [810, 441]
  rain_history: 4
  rain_stride_steps: 6
  wd_history: 2
  pred_horizon: 1
  test_ratio: 0.2
  val_ratio_from_train: 0.15
  patch_size: 256
  train_samples_per_epoch: 4000
  val_samples: 512
  dem_clip: [0.0, 2000.0]
  rain_clip: [0.0, 100.0]
  wd_clip: [0.0, 30.0]

model:
  base_channels: 32

train:
  batch_size: 8
  num_workers: 4
  lr: 0.0003
  weight_decay: 0.0001
  epochs: 40
  amp: true
  grad_clip: 1.0
  lambda_huber: 1.0
  lambda_mass: 0.05
  lambda_slope: 0.02
  lambda_temporal: 0.02
  lambda_wetdry: 0.05
  lambda_sv: 0.02
  lambda_manning: 0.01
  dt: 300.0
  wet_threshold_m: 0.1
  wet_bce_temperature: 0.05
  slope_epsilon: 0.002
  log_first_n_steps: 5
  device: cuda

output:
  dir: outputs/sv_loss
  save_every: 1