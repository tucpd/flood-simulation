seed: 42

data:
  root: data/pakistan
  cache_dir: data/pakistan/cache
  label_dir: flood_maps
  label_naming: index
  label_step_sec: 300
  target_shape: [810, 441]
  rain_history: 4
  rain_stride_steps: 6
  wd_history: 2
  pred_horizon: 1
  test_ratio: 0.2
  val_ratio_from_train: 0.15
  patch_size: 128
  train_samples_per_epoch: 10
  val_samples: 2
  dem_clip: [0.0, 2000.0]
  rain_clip: [0.0, 100.0]
  wd_clip: [0.0, 30.0]

regions:
  - name: pakistan
    root: data/pakistan
    cache_dir: data/pakistan/cache
    label_dir: flood_maps
    label_naming: index
    label_step_sec: 300
    dem_clip: [0.0, 2000.0]
    rain_clip: [0.0, 100.0]
    wd_clip: [0.0, 30.0]

  - name: australia
    root: data/australia
    cache_dir: data/australia/cache
    label_dir: flood_maps
    label_naming: seconds
    label_step_sec: 300
    dem_clip: [0.0, 2000.0]
    rain_clip: [0.0, 100.0]
    wd_clip: [0.0, 30.0]

  - name: mozambique
    root: data/mozambique
    cache_dir: data/mozambique/cache
    label_dir: flood_maps
    label_naming: seconds
    label_step_sec: 300
    dem_clip: [0.0, 2000.0]
    rain_clip: [0.0, 100.0]
    wd_clip: [0.0, 30.0]

  - name: uk
    root: data/uk
    cache_dir: data/uk/cache
    label_dir: flood_maps
    label_naming: seconds
    label_step_sec: 300
    dem_clip: [0.0, 2000.0]
    rain_clip: [0.0, 100.0]
    wd_clip: [0.0, 30.0]

model:
  base_channels: 32

train:
  batch_size: 2
  num_workers: 0
  lr: 0.0003
  weight_decay: 0.0001
  epochs: 1
  amp: false
  grad_clip: 1.0
  lambda_huber: 1.0
  lambda_mass: 0.05
  lambda_slope: 0.02
  lambda_temporal: 0.02
  lambda_wetdry: 0.05
  lambda_sv: 0.02
  lambda_manning: 0.01
  dt: 300.0
  wet_threshold_m: 0.1
  wet_bce_temperature: 0.05
  slope_epsilon: 0.002
  log_first_n_steps: 5
  device: cuda

output:
  dir: outputs/block4_smoke
  save_every: 1